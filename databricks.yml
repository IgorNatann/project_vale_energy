# This is a Declarative Automation Bundle definition for project_vale_energy.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_vale_energy
  uuid: 8e63f0a7-1f86-4c16-9351-a44c992b7a45

include:
  - resources/*.yml

# Os Parquet sobem para o volume raw.landing, não com o bundle.
sync:
  exclude:
    - data/**
    - skill/**

# O isolamento entre dev e prod é feito pelo catálogo: os schemas mantêm o nome da camada
# nos dois ambientes, sem o prefixo de usuário do mode: development.
experimental:
  skip_name_prefix_for_schema: true

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  duracao_minima_interrupcao:
    description: Duração mínima de interrupção, em minutos
    default: "3"
  queda_minima_consumo:
    description: Queda relativa da UC para sinalizar inspeção (valor demonstrativo)
    default: "0.30"
  variacao_maxima_conjunto:
    description: Variação relativa máxima para considerar o conjunto estável (valor demonstrativo)
    default: "0.10"
  usar_ia:
    description: Usa funções de IA nas transcrições quando verdadeiro
    default: "true"
  grupo_atendimento:
    description: Grupo autorizado a consultar dados pessoais dos chamados
    default: atendimento
  warehouse_id:
    description: SQL warehouse para a aplicação das máscaras de acesso

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-52721ce8-5907.cloud.databricks.com
    variables:
      catalog: grid_dev
      warehouse_id: cd126800c459c7c6
  prod:
    mode: production
    workspace:
      host: https://dbc-52721ce8-5907.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/igornatan4@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/igornatan4@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
      warehouse_id: cd126800c459c7c6
    permissions:
      - user_name: igornatan4@gmail.com
        level: CAN_MANAGE
