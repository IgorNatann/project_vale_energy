[project]
name = "project_vale_energy"
version = "0.0.1"
authors = [{ name = "igornatan4@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[tool.uv]
# O código roda no Databricks a partir de src/; não há pacote Python para instalar.
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "databricks: requer acesso a um SQL warehouse do Databricks",
    "reexecucao: executa novamente o pipeline de desenvolvimento",
]
